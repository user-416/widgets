# Kept as "gridkit-worker" (the pre-rename name) on purpose: Cloudflare scopes
# secrets per worker name, so renaming would orphan STRAVA_CLIENT_ID and
# STRAVA_CLIENT_SECRET and require re-entering both from the Strava dashboard.
# This name is internal — it never appears in the UI. Deploying under this name
# keeps the existing secrets and just updates the code.
name = "gridkit-worker"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Required env vars — all read in src/index.ts as `c.env.<NAME>`.
#
# Production (after `wrangler deploy`):
#   wrangler secret put STRAVA_CLIENT_ID
#   wrangler secret put STRAVA_CLIENT_SECRET
#
# Local dev (`wrangler dev`):
#   cp .dev.vars.example .dev.vars   # gitignored
#   # then edit .dev.vars with real values
#
# Strava values come from your Strava app at https://www.strava.com/settings/api.

# Per-IP throttle on /strava/* so the token endpoints can't be used to burn our
# Strava API quota. namespace_id is any number unique within this worker.
[[unsafe.bindings]]
name = "TOKEN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
